lang: en

project:
  type: website
  post-render:
    - fix_sitemap.py
  resources:
    - "robots.txt"
    - "CNAME"
    - "public"
    - "fonts"
    - "kareem.jpg"

ipynb-filters:
  - quarto_filter.py

execute:
  eval: false

website:
  search: true
  title: "Abdelkareem Elkhateb"
  image: /kareem.jpg
  page-footer:
    center:
      - icon: github
        href: https://github.com/abdelkareemkobo
        aria-label: "GitHub Profile"
      - icon: cloud
        href: https://soundcloud.com/abdelkareem-elkhateb
        aria-label: "SoundCloud"
      - icon: google
        href: https://kareemai.com/kareem01095134688@gmail.com
        aria-label: "Email Contact"
      - icon: bank
        href: https://www.upwork.com/freelancers/~016a9fea792423bb9a
        aria-label: "Upwork Profile"
      - icon: rss
        href: /blog/feed.xml
        aria-label: "RSS Feed"
  favicon: favicon.ico
  open-graph:
    locale: en_US
    site-name: "Abdelkareem Elkhateb"
    image: /kareem.jpg
    image-width: 1200
    image-height: 630
  google-analytics: "G-XFPC3M9TMG"
  twitter-card:
    creator: "@AbdelkareemElk1"
    card-style: summary_large_image
    image: /kareem.jpg
  site-url: "https://kareemai.com"
  description: "Kareem Elkhateb personal site, a blog about machine learning, deep learning, Web development with Astro.js, FastAPI, also Arabic Natural Language Processing and Rust language."
  repo-url: https://github.com/abdelkareemkobo/kareem_site
  # repo-actions: [edit]
  repo-branch: master
  navbar:
    title: false
    background: light
    pinned: true
    collapse: true
    collapse-below: lg
    left:
      - icon: house
        text: Home
        href: index.qmd
      - icon: journal-text
        text: Blog
        href: blog/feed.qmd
      - icon: lightbulb
        text: TILs
        file: til/index.qmd
      - icon: file-text
        text: Papers
        file: papers.qmd
      - icon: book
        text: Books
        file: publish.qmd
    right:
      - icon: telegram
        href: https://t.me/+xRY72sYuiwc0ZGY8
      - icon: youtube
        text: Videos
        href: https://youtube.com/@AbdelkareemElkhatib
      - icon: briefcase
        text: Hire Me
        href: https://www.upwork.com/freelancers/~016a9fea792423bb9a
      - icon: cpu
        text: GPUVec
        href: https://gpuvec.com
      - icon: rss
        href: /blog/feed.xml
        aria-label: "Blog RSS Feed"
      - icon: rss
        href: /til/index.xml
        aria-label: "TILs RSS Feed"

  sidebar:
    - title: TILs
      pinned: true
      collapse-level: 1
      style: docked
      contents: notes/**

format:
  html:
    lang: en
    canonical-url: true
    metadata:
      description: "Kareem Elkhateb personal site, a blog about machine learning, deep learning, Web development with Astro.js, FastAPI, also Arabic Natural Language Processing and Rust language."
      robots: "index, follow"
    filters:
      - obsidian-callout.lua
      - _extensions/jsonld/jsonld.lua
    reference-location: document
    include-in-header:
      - _includes/preconnect.html
    include-after-body:
      - _includes/fold-headings.html
      - _includes/post-hero-image.html
      - _includes/prefetch.html
      - _includes/listing-cleanup.html
      - _includes/obsidian-callout-fold.html
    theme:
      light: spacelab
      dark: cyborg
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "Contents"
    syntax-definitions:
      - fomo.xml
    fontsize: 18px
    css:
      - shimmering-fonts.css
      - styles.css
    comments:
      giscus:
        repo: abdelkareemkobo/kareem_site
        repo-id: R_kgDOQxY8kw
        category: Comments
        category-id: DIC_kwDOQxY8k84C0aRf
        mapping: pathname
        reactions-enabled: true
        theme: preferred_color_scheme
        language: en
